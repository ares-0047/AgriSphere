<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Terrain Visualizer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { background-color: transparent; overflow: hidden; }
        .canvas-container { width: 100%; height: 500px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border-color); position: relative; background: #e0f2fe; }
        
        .overlay-controls {
            position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.9);
            padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow-md); width: 250px;
        }
        
        input[type="range"] { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="page-header">
            <h1>3D Soil Profile Simulator</h1>
            <p class="subtitle">Interactive cross-section of land hydrology and root depth.</p>
        </div>

        <div class="canvas-container" id="canvasBox">
            <div class="overlay-controls">
                <h3 style="font-size: 1rem; margin-bottom: 10px;">Terrain Variables</h3>
                <label style="font-size: 0.8rem; font-weight: bold;">Soil Moisture Content</label>
                <input type="range" id="moistureSlider" min="0" max="100" value="30">
                <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 5px;">Currently: <span id="moistValue">30</span>%</p>
                
                <hr style="border: 0; border-top: 1px dashed #ccc; margin: 15px 0;">
                
                <label style="font-size: 0.8rem; font-weight: bold;">Auto-Rotate 3D Model</label>
                <button onclick="toggleRotation()" id="rotBtn" style="padding: 5px 10px; margin-top: 5px; width: 100%;">Pause Rotation</button>
            </div>
        </div>
    </div>

    <script>
        // Setup Three.js Scene
        const container = document.getElementById('canvasBox');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Create the Soil Block (3 Layers)
        const blockGroup = new THREE.Group();

        // Top Layer (Grass/Topsoil)
        const topGeo = new THREE.BoxGeometry(10, 1, 10);
        const topMat = new THREE.MeshStandardMaterial({ color: 0x4ade80 }); // Green
        const topMesh = new THREE.Mesh(topGeo, topMat);
        topMesh.position.y = 2.5;
        blockGroup.add(topMesh);

        // Middle Layer (Subsoil)
        const midGeo = new THREE.BoxGeometry(10, 3, 10);
        const midMat = new THREE.MeshStandardMaterial({ color: 0x8b4513 }); // Brown
        const midMesh = new THREE.Mesh(midGeo, midMat);
        midMesh.position.y = 0.5;
        blockGroup.add(midMesh);

        // Bottom Layer (Bedrock/Water Table)
        const botGeo = new THREE.BoxGeometry(10, 2, 10);
        const botMat = new THREE.MeshStandardMaterial({ color: 0x555555 }); // Gray
        const botMesh = new THREE.Mesh(botGeo, botMat);
        botMesh.position.y = -2;
        blockGroup.add(botMesh);

        scene.add(blockGroup);
        camera.position.set(12, 10, 15);
        camera.lookAt(0, 0, 0);

        // Animation Loop
        let isRotating = true;
        function animate() {
            requestAnimationFrame(animate);
            if(isRotating) {
                blockGroup.rotation.y += 0.005;
            }
            renderer.render(scene, camera);
        }
        animate();

        // UI Controls
        function toggleRotation() {
            isRotating = !isRotating;
            document.getElementById('rotBtn').innerText = isRotating ? "Pause Rotation" : "Start Rotation";
        }

        // Moisture Logic (Turns the soil darker/blueish)
        document.getElementById('moistureSlider').addEventListener('input', function(e) {
            const val = e.target.value;
            document.getElementById('moistValue').innerText = val;
            
            // Interpolate color from dry brown to wet dark-brown/blue
            const wetness = val / 100;
            const newColor = new THREE.Color(0x8b4513).lerp(new THREE.Color(0x1e3a8a), wetness);
            midMesh.material.color = newColor;
        });

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
